<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Super Kid Saves the Planet</title>
  <meta name="description" content="A kid-friendly arcade game where you catch eco items, answer quiz questions and save the planet!" />
  <link rel="icon" href="assets/images/super_kid.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game" width="1200" height="900" tabindex="0"></canvas>
    <button id="mute-btn" class="mute" type="button" aria-label="Toggle sound" title="Toggle sound">🔊</button>
    <p id="hint">Use <b>← →</b> or <b>A D</b> to move · on touch, hold left / right side</p>
  </div>

  <script src="js/quizzes.js"></script>
  <script src="js/game.js"></script>

</html>
